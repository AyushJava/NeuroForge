spring.application.name=neuroforge-backend

# ─── Database ────────────────────────────────────────────────────────────────
# Override any of these with environment variables (DB_URL / DB_USERNAME / DB_PASSWORD)
# when running locally in VS Code, e.g. via a .env file loaded by your shell.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Fast}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server (auth + api on same port) ───────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ─── JWT ────────────────────────────────────────────────────────────────────
github.token.encryption.key=${GITHUB_TOKEN_ENCRYPTION_KEY}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

# ─── Mail (OTP / invitations) — set MAIL_USERNAME/MAIL_PASSWORD env vars ────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Swagger ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs

# ─── MongoDB (Module 4: AI Specification Storage) ───────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/neuroforge_ai}
spring.data.mongodb.auto-index-creation=true

# ─── Google Gemini (Module 4: AI Generation) ────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Jackson ────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Frontend URL (used in invitation emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5000}

# ─── Module 9: CI/CD Pipeline Configuration ───────────────────────────────
# Pipeline failure rates (in percentage)
pipeline.failure-rate=20
pipeline.production-failure-rate=10

# Groq API Key for AI Release Notes (optional - set environment variable for LLM features)
groq.api.key=${GROQ_API_KEY}
groq.model=qwen/qwen3.8-27b

# ─── Module 14: Analytics Configuration ───────────────────────────────────────
# Analytics snapshot aggregation schedule (cron expression: 0 0 2 * * * = daily at 2 AM)
analytics.snapshot.cron=${ANALYTICS_SNAPSHOT_CRON:0 0 2 * * *}
